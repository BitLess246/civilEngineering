# CI — typecheck + lint + tests on every push/PR to main.
#
# THIS USED TO ALSO DEPLOY TO GITHUB PAGES, and that deploy was removed.
#
# It uploaded `path: '.'` — the whole repository, unbuilt — on every push to
# main. Production is Vercel (see README), so the Pages site served nothing
# anyone used, and because there is no index.html at the repo root it answered
# 404 and looked dead. It was not: every file in the repo was fetchable from it
# (`…/CLAUDE.md`, `…/HANDOFF.md`, `…/docs/Billing.md` all returned 200), so the
# job was quietly publishing the source, the pricing and competitive strategy
# docs, and the audit findings, to anyone with the URL.
#
# Deleting the job stops future publishes. It does NOT unpublish the site that
# is already there — that is Settings → Pages → Source: None in the repository
# settings, and it has to be done by hand.
#
# The workflow FILE keeps its name. `static.yml` no longer describes what it
# does, but the job id `ci` is what branch protection requires by name and what
# docs/Roadmap.md points at, and renaming for tidiness is not worth breaking
# either.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only: nothing here publishes any more. The `pages: write` and
# `id-token: write` grants the deploy needed went with it.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      # Gating. `npm run lint` runs with --max-warnings 0, so warnings fail too —
      # main is clean and the point of the gate is to keep it that way.
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
