<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ink:#0f1b2a; --ink2:#3d4a5c; --night:#0b1420; --paper:#f4f3ef; --sheet:#ffffff; --sheet2:#f9f8f4;
  --brand:#0f4c92; --accent:#6ba4dc; --muted:#9eb0c5; --hair:#e3e1da; --amber:#f2b53a;
  --ok:#14603a; --okt:#ddefe3; --fail:#c2402a; --failt:#fbeeea; --rail:#0f1b2a; --logo:#0f2a4a;
  --fg: #e8eaed;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b1420}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;inset:0;overflow:hidden;background:#0b1420}
.layer{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity}
.abs{position:absolute}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.disp{font-weight:800;letter-spacing:-.035em;line-height:.92}
.glow{filter:drop-shadow(0 0 10px rgba(242,181,58,.9)) drop-shadow(0 0 34px rgba(242,181,58,.45))}
.ground-dark{position:absolute;inset:-200px;background:
  radial-gradient(1200px 800px at 50% 45%, #15283f 0%, #0f1b2a 55%, #0a131e 100%)}
.grid{position:absolute;inset:-400px;opacity:1;
  background-image:
   linear-gradient(rgba(107,164,220,.11) 1px,transparent 1px),
   linear-gradient(90deg,rgba(107,164,220,.11) 1px,transparent 1px),
   linear-gradient(rgba(107,164,220,.045) 1px,transparent 1px),
   linear-gradient(90deg,rgba(107,164,220,.045) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px}
.ground-paper{position:absolute;inset:-200px;background:radial-gradient(1400px 900px at 50% 40%, #f8f7f3 0%, #f1efe9 70%, #e9e6de 100%)}
.grid-paper{position:absolute;inset:-400px;
  background-image:
   linear-gradient(rgba(15,27,42,.07) 1px,transparent 1px),
   linear-gradient(90deg,rgba(15,27,42,.07) 1px,transparent 1px),
   linear-gradient(rgba(15,27,42,.03) 1px,transparent 1px),
   linear-gradient(90deg,rgba(15,27,42,.03) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 0 rgba(15,27,42,.06),0 18px 50px -12px rgba(5,12,22,.35),0 60px 120px -40px rgba(5,12,22,.45)}
.card-dark{background:#0f1b2a;border:1px solid rgba(158,176,197,.18);border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.08em}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1300px 900px at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%)}
.grain{position:absolute;inset:-64px;pointer-events:none;mix-blend-mode:overlay;opacity:.11;background-size:256px 256px}
svg{overflow:visible}
.seq{position:absolute;left:0;top:0;display:none}
table{border-collapse:collapse}
</style></head>
<body><div id="stage"></div>
