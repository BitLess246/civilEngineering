<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Civil Engineering</title>
    <!-- Google tag (gtag.js) — GA4. The initial load is counted by gtag('config')
         below; route changes inside the SPA are counted by usePageViews() in
         src/lib/analytics.ts, which deliberately skips that first render.

         THIS CALL IS THE ONE THAT SEES A CREDENTIAL. A Supabase sign-in comes
         back through the URL (detectSessionInUrl), so a redirect lands here as
         `#access_token=…` or `?code=…` — and this script runs in <head>, before
         the bundle, before the auth client, before anything can strip it. So
         page_location is set explicitly rather than left to gtag's default of
         document.location.href. The list mirrors CREDENTIAL_PARAMS in
         src/lib/analytics.ts, and a test asserts the two agree. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MXJVLJ8RWV"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-MXJVLJ8RWV', {
        page_location: (function () {
          try {
            var u = new URL(location.href)
            u.hash = ''
            var drop = ['access_token', 'refresh_token', 'provider_token', 'provider_refresh_token', 'id_token', 'code', 'token', 'token_hash']
            for (var i = 0; i < drop.length; i++) u.searchParams.delete(drop[i])
            return u.toString()
          } catch (e) { return String(location.href).split(/[?#]/)[0] }
        })(),
      })
    </script>
    <!-- Theme, before first paint. This runs synchronously in <head>, ahead of
         the bundle, because React applying the attribute on mount is one frame
         too late: a Blueprint user would see a white page flash on every
         navigation and reload. Inlined for the same reason — an external file
         is another round trip before anything can be painted.
         Kept deliberately tiny and duplicated from lib/theme.ts rather than
         imported: this must not depend on the bundle it precedes. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('civeng-theme')
          var ok = ['drafting', 'daylight', 'blueprint', 'mono', 'minimal']
          document.documentElement.setAttribute('data-theme', ok.indexOf(t) > -1 ? t : 'drafting')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'drafting')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
