<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Zeta</title>
    <!-- What a shared link unfurls into (Facebook, LinkedIn, Messenger, X,
         Slack). One card for the whole SPA: crawlers do not run the bundle, so
         these static tags are all they ever see. og:image must be absolute.
         No canonical and no og:url here: this one file serves every route,
         so either would declare every page a duplicate of the home page. -->
    <meta name="description" content="Code-checked structural calculators, 3D frame analysis and quantity take-off for NSCP 2015, ACI 318-14 and AISC 360-16 — every result traced to its clause, every report ready to sign." />
    <meta name="theme-color" content="#0f1b2a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zeta" />
    <meta property="og:title" content="Zeta — the structural workbench for Philippine practice" />
    <meta property="og:description" content="Code-checked calculators, 3D analysis and take-off for NSCP 2015, ACI 318-14 and AISC 360-16. Every answer shows its work." />
    <meta property="og:image" content="https://www.zetastruct.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Zeta logo and wordmark on a drafting grid: the structural workbench for Philippine practice." />
    <meta property="og:locale" content="en_PH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zeta — the structural workbench for Philippine practice" />
    <meta name="twitter:description" content="Code-checked calculators, 3D analysis and take-off for NSCP 2015, ACI 318-14 and AISC 360-16. Every answer shows its work." />
    <meta name="twitter:image" content="https://www.zetastruct.app/og-image.png" />
    <!-- Google tag (gtag.js) — GA4. The initial load is counted by gtag('config')
         below; route changes inside the SPA are counted by usePageViews() in
         src/lib/analytics.ts, which deliberately skips that first render.

         THIS CALL IS THE ONE THAT SEES A CREDENTIAL. A Supabase sign-in comes
         back through the URL (detectSessionInUrl), so a redirect lands here as
         `#access_token=…` or `?code=…` — and this script runs in <head>, before
         the bundle, before the auth client, before anything can strip it. So
         page_location is set explicitly rather than left to gtag's default of
         document.location.href. The list mirrors CREDENTIAL_PARAMS in
         src/lib/analytics.ts, and a test asserts the two agree. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MXJVLJ8RWV"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-MXJVLJ8RWV', {
        page_location: (function () {
          try {
            var u = new URL(location.href)
            u.hash = ''
            var drop = ['access_token', 'refresh_token', 'provider_token', 'provider_refresh_token', 'id_token', 'code', 'token', 'token_hash']
            for (var i = 0; i < drop.length; i++) u.searchParams.delete(drop[i])
            return u.toString()
          } catch (e) { return String(location.href).split(/[?#]/)[0] }
        })(),
      })
    </script>
    <!-- Theme, before first paint. This runs synchronously in <head>, ahead of
         the bundle, because React applying the attribute on mount is one frame
         too late: a Blueprint user would see a white page flash on every
         navigation and reload. Inlined for the same reason — an external file
         is another round trip before anything can be painted.
         Kept deliberately tiny and duplicated from lib/theme.ts rather than
         imported: this must not depend on the bundle it precedes. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('civeng-theme')
          var ok = ['drafting', 'daylight', 'blueprint', 'mono', 'minimal']
          document.documentElement.setAttribute('data-theme', ok.indexOf(t) > -1 ? t : 'drafting')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'drafting')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
