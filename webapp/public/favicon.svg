<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="t">
  <title id="t">CivEngg Toolkit</title>
  <desc>A portal frame on two fixed bases</desc>
  <!-- Drafting blue tile (the brand blue), rounded to sit as an app mark rather
       than a bare glyph: an untiled favicon loses its silhouette on a dark tab. -->
  <rect width="48" height="48" rx="10" fill="#0f4c92"/>
  <!-- The frame, knocked out in paper. Limbs are 8 of 48 and the opening is
       20 x 22, so at a 16 px tab the counter is still about 6.7 px and holds. -->
  <path fill="#fff" d="M6 7h36v30h-8V15H14v22H6Z"/>
  <!-- Base plates, projecting past each column: two supports rather than one
       ground line, which is what keeps it reading as a frame and not a doorway. -->
  <rect x="2.5" y="36.5" width="15" height="6" rx="1.8" fill="#fff"/>
  <rect x="30.5" y="36.5" width="15" height="6" rx="1.8" fill="#fff"/>
</svg>
